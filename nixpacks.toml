[phases.setup]
nixPkgs = ["nodejs-18_x", "npm"]

[phases.install]
cmds = [
  "npm ci --production=false --legacy-peer-deps",
  "cd backend && npm ci --legacy-peer-deps",
  "cd ../frontend && npm ci --legacy-peer-deps"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "node backend/server.js"

[variables]
NODE_ENV = "production"
