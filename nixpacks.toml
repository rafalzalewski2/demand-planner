[phases.setup]
nixPkgs = ["nodejs-22_x", "npm"]

[phases.install]
cmds = [
  "cd backend && npm ci --legacy-peer-deps --cache /tmp/.npm",
  "cd ../frontend && npm ci --legacy-peer-deps --cache /tmp/.npm"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "node backend/server.js"

[variables]
NODE_ENV = "production"
